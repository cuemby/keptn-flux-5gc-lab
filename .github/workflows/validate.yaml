name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the full history
          persist-credentials: false

      - name: Install pinned tools
        run: make tools

      - name: kustomize build + kubeconform + shellcheck
        run: make validate

      - name: actionlint, SHA-pinned actions, gitleaks
        run: make lint

      # A change to the Open5GS release inputs must also bump RELEASE_ID in
      # clusters/lab/apps.yaml, otherwise Keptn sees no new app version.
      - name: RELEASE_ID bump check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if grep -qE '^apps/open5gs/(values/|helmrelease-[^/]+\.yaml$|kustomization\.yaml$)' <<<"$changed" \
             && ! grep -qx 'clusters/lab/apps.yaml' <<<"$changed"; then
            echo "::error file=clusters/lab/apps.yaml::Open5GS release inputs changed without a RELEASE_ID bump; run scripts/bump-release.sh lab"
            exit 1
          fi
