name: e2e

# Runs the whole lab on Kind against the commit under test, with no GitHub token: Flux reconciles
# the checkout through a local OCI registry, and the Keptn tasks send their workflow_dispatch calls
# to an in-cluster GitHub API mock (see scripts/e2e.sh).
#
# kind (every pull request; workflow_dispatch with variant light or all): light profile, kindnet.
#   Scenarios 1 (happy path), 2 (fault: kpi-guard requests a rollback, promotion skipped),
#   6 (RBAC matrix and add-user.sh), 10 (SLO Analysis passes, then fails during the fault) and
#   11 (kpi-guard-py: a healed release passes, a faulty one requests a rollback).
# kind-extended (nightly; workflow_dispatch with variant full, cilium or all): the same scenarios on
#   the full profile (3 nodes, kindnet) and on the light profile with Cilium, where scenario 7
#   (NetworkPolicies and SCTP) runs too. Too slow for every pull request.
# The GitHub side of rollbacks and promotions, the loop guard and mission control need a real
# repository and tokens: scripts/live-github-check.sh (live-github-check.yaml in a sandbox).
on:
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      variant:
        description: Which e2e jobs to run
        type: choice
        options: [light, full, cilium, all]
        default: light

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant || 'default' }}
  cancel-in-progress: true

jobs:
  kind:
    if: github.event_name == 'pull_request' || inputs.variant == 'light' || inputs.variant == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      E2E_MIN_AVAIL_MIB: "6144"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State directory outside the checkout
        run: echo "E2E_DIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain (mise.toml)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.19
          cache: true

      - name: Create the Kind cluster and the local registry
        run: scripts/e2e.sh up

      - name: Install Flux, push the commit, create Secrets and the GitHub mock
        run: scripts/e2e.sh flux

      - name: Wait for every Kustomization and HelmRelease
        run: scripts/e2e.sh wait

      - name: First Keptn app version
        run: scripts/e2e.sh baseline

      - name: Scenario 6 - RBAC matrix and add-user.sh
        run: scripts/e2e.sh rbac

      - name: Scenario 1 - happy path (and scenario 10, healthy Analysis)
        run: scripts/e2e.sh happy

      - name: Scenario 2 - faulty release, rollback requested
        run: scripts/e2e.sh fault

      - name: Scenario 10 - Analysis during the fault
        run: scripts/e2e.sh slo

      - name: Scenario 11 - kpi-guard-py, healed then faulty release
        run: scripts/e2e.sh python

      - name: Memory summary
        if: always()
        run: scripts/e2e.sh memory

      - name: Collect diagnostics
        if: failure()
        run: scripts/e2e.sh diag "$E2E_DIR/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e/diagnostics
          retention-days: 7
          if-no-files-found: warn

      - name: Delete the cluster
        if: always()
        run: scripts/e2e.sh down

  kind-extended:
    # Nightly only in the lab's own repository (not in forks or the live-check sandbox).
    if: >-
      (github.event_name == 'schedule' && github.repository == 'cuemby/keptn-flux-5gc-lab')
      || (github.event_name == 'workflow_dispatch' && inputs.variant != 'light')
    name: kind (${{ matrix.profile }}, ${{ matrix.cni }})
    runs-on: ubuntu-latest   # 4 vCPU, 16 GB on public repositories
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Both variants nightly and for variant "all"; otherwise only the dispatched one.
        include: >-
          ${{ fromJSON(
            inputs.variant == 'full' && '[{"variant":"full","profile":"full","cni":"kindnet","min_avail_mib":"12288"}]'
            || inputs.variant == 'cilium' && '[{"variant":"cilium","profile":"light","cni":"cilium","min_avail_mib":"6144"}]'
            || '[{"variant":"full","profile":"full","cni":"kindnet","min_avail_mib":"12288"},{"variant":"cilium","profile":"light","cni":"cilium","min_avail_mib":"6144"}]'
          ) }}
    env:
      PROFILE: ${{ matrix.profile }}
      CNI: ${{ matrix.cni }}
      E2E_MIN_AVAIL_MIB: ${{ matrix.min_avail_mib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State directory outside the checkout
        run: echo "E2E_DIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain (mise.toml)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.19
          cache: true

      - name: Runner resources
        run: |
          echo "CPUs: $(nproc)"
          free -m
          df -h / | tail -n 1

      - name: Create the Kind cluster and the local registry (Cilium when CNI=cilium)
        run: scripts/e2e.sh up

      - name: Install Flux, push the commit, create Secrets and the GitHub mock
        run: scripts/e2e.sh flux

      - name: Wait for every Kustomization and HelmRelease
        run: scripts/e2e.sh wait

      - name: First Keptn app version
        run: scripts/e2e.sh baseline

      - name: Scenario 6 - RBAC matrix and add-user.sh
        run: scripts/e2e.sh rbac

      - name: Scenario 7 - NetworkPolicies and SCTP (Cilium)
        if: matrix.cni == 'cilium'
        run: scripts/e2e.sh netpol

      - name: Scenario 1 - happy path (and scenario 10, healthy Analysis)
        run: scripts/e2e.sh happy

      - name: Scenario 2 - faulty release, rollback requested
        run: scripts/e2e.sh fault

      - name: Scenario 10 - Analysis during the fault
        run: scripts/e2e.sh slo

      - name: Scenario 11 - kpi-guard-py, healed then faulty release
        run: scripts/e2e.sh python

      - name: Memory summary
        if: always()
        run: scripts/e2e.sh memory

      - name: Collect diagnostics
        if: failure()
        run: scripts/e2e.sh diag "$E2E_DIR/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ matrix.variant }}
          path: ${{ runner.temp }}/e2e/diagnostics
          retention-days: 7
          if-no-files-found: warn

      - name: Delete the cluster
        if: always()
        run: scripts/e2e.sh down
