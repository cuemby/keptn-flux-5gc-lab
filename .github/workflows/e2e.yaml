name: e2e

# Runs the whole lab on Kind (light profile) against the commit under test, with no GitHub
# token: Flux reconciles the checkout through a local OCI registry, and the Keptn tasks send their
# workflow_dispatch calls to an in-cluster GitHub API mock (see scripts/e2e.sh).
# Scenarios: 1 (happy path) and 2 (fault: kpi-guard requests a rollback, promotion skipped).
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      E2E_MIN_AVAIL_MIB: "6144"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State directory outside the checkout
        run: echo "E2E_DIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain (mise.toml)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.19
          cache: true

      - name: Create the Kind cluster and the local registry
        run: scripts/e2e.sh up

      - name: Install Flux, push the commit, create Secrets and the GitHub mock
        run: scripts/e2e.sh flux

      - name: Wait for every Kustomization and HelmRelease
        run: scripts/e2e.sh wait

      - name: First Keptn app version
        run: scripts/e2e.sh baseline

      - name: Scenario 1 - happy path
        run: scripts/e2e.sh happy

      - name: Scenario 2 - faulty release, rollback requested
        run: scripts/e2e.sh fault

      - name: Memory summary
        if: always()
        run: scripts/e2e.sh memory

      - name: Collect diagnostics
        if: failure()
        run: scripts/e2e.sh diag "$E2E_DIR/diagnostics"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e/diagnostics
          retention-days: 7
          if-no-files-found: warn

      - name: Delete the cluster
        if: always()
        run: scripts/e2e.sh down
