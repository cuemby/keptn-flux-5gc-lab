# Keptn (chart 0.11.0 = Keptn v2.5.0) and its KeptnConfig.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: observability
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/keptn
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The KeptnConfig needs the Keptn CRDs, which the platform HelmRelease installs, so it is
# applied by its own Kustomization once platform is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-config
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./platform/keptn/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
