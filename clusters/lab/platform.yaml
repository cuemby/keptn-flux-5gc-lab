# Keptn (chart 0.11.0 = Keptn v2.5.0) and its KeptnConfig.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: observability
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/keptn
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
