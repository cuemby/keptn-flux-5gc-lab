# kube-prometheus-stack, OpenTelemetry Collector, Flux PodMonitor, alert rules, dashboards.
# No postBuild here, so ${env:...} strings in the collector config are left alone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/observability
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
