# Optional: Jaeger v2 (in-memory) as the trace backend for the OTel Collector.
# Kept out of ./infrastructure/observability so it can be switched off by removing
# this file from clusters/lab/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tracing
  namespace: flux-system
spec:
  dependsOn:
    - name: observability
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/observability/tracing
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
