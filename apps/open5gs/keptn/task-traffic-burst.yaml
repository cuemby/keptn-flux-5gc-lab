# Container runtime. Same script as traffic/traffic-pulse.yaml, with a longer
# ping and a gNB restart first, run as Keptn post-deployment task (hackathon
# Use-Case One, step 1).
apiVersion: lifecycle.keptn.sh/v1
kind: KeptnTaskDefinition
metadata:
  name: traffic-burst
  namespace: open5gs
  annotations: { kustomize.toolkit.fluxcd.io/substitute: disabled }
spec:
  timeout: 5m
  retries: 0
  ttlSecondsAfterFinished: 600
  serviceAccount: { name: keptn-traffic }       # defined in traffic/traffic-pulse.yaml
  container:
    name: traffic
    image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
    env:
      - { name: HOME, value: /tmp }
      - { name: UE_DEPLOYMENT, value: "ueransim-gnb-ues" }
      - { name: GNB_DEPLOYMENT, value: "ueransim-gnb" }                    # restarted first: see below
      - { name: UE_SELECTOR, value: "app.kubernetes.io/component=ues" }
      - { name: UE_TUN, value: "uesimtun0" }
      - { name: UPF_GW, value: "10.45.0.1" }
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -eu
        # UERANSIM 3.2.6 does not redo NG Setup when its AMF association drops (every release
        # rolls the AMF), so restart the gNB first, then the UEs that attach to it.
        kubectl rollout restart "deployment/$GNB_DEPLOYMENT"
        kubectl rollout status "deployment/$GNB_DEPLOYMENT" --timeout=120s
        sleep 5
        # Right after a release the SMF may still be re-associating with the new UPF, and a UE whose
        # PDU session fails does not retry it: wait for the tunnel, restart the UEs again if needed.
        for attempt in 1 2 3; do
          kubectl rollout restart "deployment/$UE_DEPLOYMENT"
          kubectl rollout status "deployment/$UE_DEPLOYMENT" --timeout=120s
          up=0
          for _ in $(seq 1 15); do
            p=$(kubectl get pods -l "$UE_SELECTOR" --field-selector=status.phase=Running -o name | head -n 1)
            if [ -n "$p" ] && kubectl exec "$p" -- ip link show "$UE_TUN" >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          [ "$up" = 1 ] && break
          echo "no PDU session on $UE_TUN yet (attempt $attempt)"
        done
        for p in $(kubectl get pods -l "$UE_SELECTOR" --field-selector=status.phase=Running -o name); do
          kubectl exec "$p" -- ping -I "$UE_TUN" -c 60 -i 0.5 "$UPF_GW" || echo "ping failed on $p"
        done
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
    resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 128Mi } }
