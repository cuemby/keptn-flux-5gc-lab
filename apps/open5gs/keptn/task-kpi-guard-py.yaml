# Python runtime alternative to kpi-guard (same logic, standard library only).
# Use it by swapping kpi-guard for kpi-guard-py in keptn/app-context.yaml.
apiVersion: lifecycle.keptn.sh/v1
kind: KeptnTaskDefinition
metadata:
  name: kpi-guard-py
  namespace: open5gs
  annotations: { kustomize.toolkit.fluxcd.io/substitute: disabled }
spec:
  timeout: 15m
  retries: 0
  ttlSecondsAfterFinished: 600
  serviceAccount: { name: keptn-task-runner }
  automountServiceAccountToken: { type: false }
  python:
    parameters:
      map:
        prometheusUrl: "http://kube-prometheus-stack-prometheus.observability.svc:9090"
        # The task starts as soon as the NFs are rolled, before the gNB and UEs are back. Wait one
        # full KPI window (2m) so the queries only see the new release's traffic.
        warmupSeconds: "120"
        soakSeconds: "300"
        pollSeconds: "30"
        minRegSuccess: "0.95"
        minPduSuccess: "0.95"
        rollbackWorkflow: "keptn-rollback.yaml"
        stage: "lab"
    secureParameters:
      secret: github-dispatch       # key SECURE_DATA: {"owner","repo","token"} (+ optional "api")
    inline:
      code: |
        import json, math, os, sys, time, urllib.error, urllib.parse, urllib.request

        data = json.loads(os.environ.get("DATA", "{}"))
        secure = json.loads(os.environ.get("SECURE_DATA", "{}"))
        ctx = json.loads(os.environ.get("KEPTN_CONTEXT", "{}"))
        prom = data["prometheusUrl"]
        # GitHub API base; the e2e test points it at a mock through the Secret.
        api = str(secure.get("api") or "https://api.github.com").rstrip("/")

        def query(expr):
            url = prom + "/api/v1/query?query=" + urllib.parse.quote(expr)
            try:
                with urllib.request.urlopen(url, timeout=10) as r:
                    body = json.load(r)
                res = body.get("data", {}).get("result", [])
                return float(res[0]["value"][1]) if res else math.nan
            except Exception as e:
                print("prometheus query failed ({}): {}".format(expr, e), file=sys.stderr, flush=True)
                return math.nan

        REQ = "sum(increase(fivegs_amffunction_rm_reginitreq[2m]))"
        REG = ("sum(increase(fivegs_amffunction_rm_reginitsucc[2m])) / "
               "clamp_min(sum(increase(fivegs_amffunction_rm_reginitreq[2m])), 1)")
        PDU = ("sum(increase(fivegs_smffunction_sm_pdusessioncreationsucc[2m])) / "
               "clamp_min(sum(increase(fivegs_smffunction_sm_pdusessioncreationreq[2m])), 1)")
        N3 = "sum(rate(fivegs_ep_n3_gtp_indatapktn3upf[2m]))"

        print("warm-up: waiting {}s for the new release's traffic".format(data.get("warmupSeconds", "0")), flush=True)
        time.sleep(int(data.get("warmupSeconds", "0")))
        breaches, samples = 0, 0
        deadline = time.time() + int(data["soakSeconds"])
        while time.time() < deadline:
            req = query(REQ)
            if req > 0:
                samples += 1
                reg, pdu, n3 = query(REG), query(PDU), query(N3)
                print(json.dumps({"req": req, "reg": reg, "pdu": pdu, "n3": n3}), flush=True)
                # "not x >= min" also treats a missing sample or failed query (NaN) as a breach
                bad = (not reg >= float(data["minRegSuccess"]) or not pdu >= float(data["minPduSuccess"])
                       or not n3 > 0)
                breaches = breaches + 1 if bad else 0
                if breaches >= 2:
                    break
            else:
                print("no registration traffic in window, waiting", flush=True)
            time.sleep(int(data["pollSeconds"]))

        if samples == 0:
            raise SystemExit("kpi-guard-py: no traffic during soak; check traffic-pulse")

        if breaches >= 2:
            url = ("{api}/repos/{owner}/{repo}/actions/workflows/{wf}/dispatches"
                   .format(api=api, owner=secure["owner"], repo=secure["repo"], wf=data["rollbackWorkflow"]))
            payload = json.dumps({"ref": "main", "inputs": {
                "stage": data["stage"],
                "appVersion": str(ctx.get("appVersion", "")),
                "reason": "kpi-guard breach: registration, PDU or N3 below threshold",
                "source": "keptn"}}).encode()
            req = urllib.request.Request(url, data=payload, method="POST", headers={
                "Authorization": "Bearer " + secure["token"],
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"})
            try:
                with urllib.request.urlopen(req, timeout=10) as r:
                    print("rollback dispatch status", r.status, flush=True)
            except urllib.error.HTTPError as e:
                raise SystemExit("kpi-guard-py: KPI breach, rollback dispatch FAILED (HTTP {}): {}"
                                 .format(e.code, e.read().decode(errors="replace")))
            except OSError as e:
                raise SystemExit("kpi-guard-py: KPI breach, rollback dispatch FAILED: {}".format(e))
            raise SystemExit("kpi-guard-py: KPI breach, rollback requested via Git")

        print("kpi-guard-py: KPIs healthy for the full soak window", flush=True)
