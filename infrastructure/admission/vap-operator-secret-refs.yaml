# Some objects the lab personas may write make a cluster-wide operator read a Secret and send it
# to an endpoint the author chooses: a KeptnMetricsProvider's secretKeyRef goes to its
# targetServer (metrics-operator), and a ServiceMonitor or PodMonitor's basic auth, bearer
# token, authorization credentials, OAuth2 client, proxy headers or TLS client Secrets go to the
# scrape target (prometheus-operator resolves them in the monitor's namespace, e.g. the
# grafana-admin Secret in observability). A ServiceMonitor's bearerTokenFile sends Prometheus'
# own ServiceAccount token the same way.
#
# These policies deny every such reference in objects written by anyone other than Git (the
# flux-apps identity and the Flux controllers, which apply the observability stack), platform
# admins and the Keptn operators. 5GC operators are also exempt from the KeptnMetricsProvider
# policy, since they can already read open5gs Secrets, but not from the ServiceMonitor and
# PodMonitor policies: they have no access to observability Secrets. One policy per kind, so each
# expression type-checks against that kind's CRD schema. They deny: like lab-keptn-task-identity
# they are a security boundary, not a hint.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-keptn-metrics-provider-secret-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["metrics.keptn.sh"]
        apiVersions: ["*"]
        resources: ["keptnmetricsproviders"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: not-trusted-author
      expression: >-
        request.userInfo.username != 'system:serviceaccount:open5gs:flux-apps'
        && !request.userInfo.username.startsWith('system:serviceaccount:flux-system:')
        && !request.userInfo.username.startsWith('system:serviceaccount:keptn-system:')
        && !request.userInfo.groups.exists(g, g in ['system:masters', 'lab:platform-admins', 'lab:5gc-operators'])
    - name: spec-changed
      expression: request.operation == 'CREATE' || object.spec != oldObject.spec
  validations:
    - expression: "!has(object.spec.secretKeyRef)"
      message: metrics providers outside Git may not reference a Secret (spec.secretKeyRef)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-keptn-metrics-provider-secret-refs
spec:
  policyName: lab-keptn-metrics-provider-secret-refs
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-servicemonitor-secret-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["*"]
        resources: ["servicemonitors"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: not-trusted-author
      expression: >-
        request.userInfo.username != 'system:serviceaccount:open5gs:flux-apps'
        && !request.userInfo.username.startsWith('system:serviceaccount:flux-system:')
        && !request.userInfo.username.startsWith('system:serviceaccount:keptn-system:')
        && !request.userInfo.groups.exists(g, g in ['system:masters', 'lab:platform-admins'])
    - name: spec-changed
      expression: request.operation == 'CREATE' || object.spec != oldObject.spec
  validations:
    - expression: >-
        !has(object.spec.endpoints) || object.spec.endpoints.all(e,
          !has(e.basicAuth) && !has(e.oauth2) && !has(e.bearerTokenSecret)
          && !has(e.proxyConnectHeader)
          && !(has(e.authorization) && has(e.authorization.credentials))
          && !(has(e.tlsConfig) && (has(e.tlsConfig.keySecret)
            || (has(e.tlsConfig.ca) && has(e.tlsConfig.ca.secret))
            || (has(e.tlsConfig.cert) && has(e.tlsConfig.cert.secret)))))
      message: >-
        scrape endpoints outside Git may not reference a Secret (basicAuth, authorization,
        oauth2, bearerTokenSecret, proxyConnectHeader, tlsConfig ca/cert/keySecret)
      reason: Forbidden
    - expression: >-
        !has(object.spec.endpoints) || object.spec.endpoints.all(e, !has(e.bearerTokenFile))
      message: scrape endpoints outside Git may not send Prometheus' token (bearerTokenFile)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-servicemonitor-secret-refs
spec:
  policyName: lab-servicemonitor-secret-refs
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-podmonitor-secret-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["*"]
        resources: ["podmonitors"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: not-trusted-author
      expression: >-
        request.userInfo.username != 'system:serviceaccount:open5gs:flux-apps'
        && !request.userInfo.username.startsWith('system:serviceaccount:flux-system:')
        && !request.userInfo.username.startsWith('system:serviceaccount:keptn-system:')
        && !request.userInfo.groups.exists(g, g in ['system:masters', 'lab:platform-admins'])
    - name: spec-changed
      expression: request.operation == 'CREATE' || object.spec != oldObject.spec
  validations:
    - expression: >-
        !has(object.spec.podMetricsEndpoints) || object.spec.podMetricsEndpoints.all(e,
          !has(e.basicAuth) && !has(e.oauth2) && !has(e.bearerTokenSecret)
          && !has(e.proxyConnectHeader)
          && !(has(e.authorization) && has(e.authorization.credentials))
          && !(has(e.tlsConfig) && (has(e.tlsConfig.keySecret)
            || (has(e.tlsConfig.ca) && has(e.tlsConfig.ca.secret))
            || (has(e.tlsConfig.cert) && has(e.tlsConfig.cert.secret)))))
      message: >-
        scrape endpoints outside Git may not reference a Secret (basicAuth, authorization,
        oauth2, bearerTokenSecret, proxyConnectHeader, tlsConfig ca/cert/keySecret)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-podmonitor-secret-refs
spec:
  policyName: lab-podmonitor-secret-refs
  validationActions: [Deny]
