# Roles for the lab personas (README section 6, docs/security.md). They are bound per namespace
# in bindings.yaml. Read access everywhere comes from the built-in "view" ClusterRole, extended
# by aggregate-crd-view.yaml.
#
# lab-keptn-author: author Keptn objects (including SLO analyses) and read task logs. It grants
# no write access to Deployments, HelmReleases or Secrets: the 5G core only changes through Git.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-keptn-author
rules:
  - apiGroups: ["lifecycle.keptn.sh"]
    resources:
      - keptnappcontexts
      - keptntaskdefinitions
      - keptnevaluationdefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.keptn.sh"]
    resources:
      - keptnmetrics
      - keptnmetricsproviders
      - analyses
      - analysisdefinitions
      - analysisvaluetemplates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
# lab-observability-editor: scrape targets, alert rules and Grafana dashboards. Dashboards are
# ConfigMaps labelled grafana_dashboard: "1"; RBAC cannot filter by label, so this covers every
# ConfigMap in the namespace it is bound in (observability). Secrets are not included, so the
# Alertmanager and Grafana credentials stay out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-observability-editor
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# lab-ui-access: what "kubectl port-forward" (scripts/ui.sh) needs for Grafana, Prometheus,
# Alertmanager and Jaeger.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ui-access
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
