# Ingress isolation for Prometheus, Alertmanager, Grafana, the OTel Collector and Jaeger.
# Egress stays open (Prometheus scrapes every namespace, Alertmanager calls the alert relay).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# PromQL queries: the Keptn metrics operator (KeptnMetric, Analysis) from keptn-system, and the
# kpi-guard task Jobs from open5gs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-queries
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keptn-system }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: open5gs }
      ports:
        - { port: 9090, protocol: TCP }
---
# OTLP traces and metrics from the Keptn lifecycle operator (KeptnConfig OTelCollectorUrl).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-from-keptn
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keptn-system }
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
---
# The kube-apiserver calls the prometheus-operator admission webhook (PrometheusRule and
# AlertmanagerConfig validation) on port 10250. The API server is not a pod, so the source
# cannot be selected portably; the rule is limited to the operator pod and that port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-webhook
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 10250, protocol: TCP }
